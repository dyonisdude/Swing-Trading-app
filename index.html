<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwingTrader Pro - V19</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { background-color: #0f172a; color: white; }
        .spin { animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
    </style>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Icons
        const IconSearch = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>;
        const IconTrendingUp = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>;
        const IconExternal = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>;
        const IconBook = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>;
        const IconCalc = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="4" y="2" width="16" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12" y2="18"/><line x1="8" y1="18" x2="8" y2="18"/><line x1="16" y1="18" x2="16" y2="18"/><line x1="8" y1="14" x2="8" y2="14"/><line x1="12" y1="14" x2="12" y2="14"/><line x1="16" y1="14" x2="16" y2="14"/><line x1="8" y1="10" x2="8" y2="10"/><line x1="12" y1="10" x2="12" y2="10"/><line x1="16" y1="10" x2="16" y2="10"/></svg>;
        const IconStar = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill={props.fill || "none"} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>;
        const IconTrash = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>;
        const IconZoom = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>;
        const IconNews = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/><path d="M18 14h-8"/><path d="M15 18h-5"/><path d="M10 6h8v4h-8V6Z"/></svg>;

        const SwingTraderPro = () => {
            // Basis settings
            const [ticker, setTicker] = useState('BESI');
            const [market, setMarket] = useState('EU'); // EU, US, UK, SE, CA
            const [exchange, setExchange] = useState('EURONEXT');
            
            // Watchlist State
            const [watchlist, setWatchlist] = useState(() => {
                const saved = localStorage.getItem('swingTraderWatchlist');
                return saved ? JSON.parse(saved) : [];
            });

            // Nieuws State
            const [newsData, setNewsData] = useState({});
            const [isFetchingNews, setIsFetchingNews] = useState(false);
            
            // Analyse inputs
            const [manualPrice, setManualPrice] = useState('');
            const [manualRSI, setManualRSI] = useState('');
            const [trend, setTrend] = useState('neutral'); 
            const [macdCross, setMacdCross] = useState('none'); 
            const [advice, setAdvice] = useState(null);

            // Update exchange bij markt wissel
            useEffect(() => {
                if (market === 'EU') setExchange('EURONEXT');
                if (market === 'US') setExchange('NASDAQ');
                if (market === 'UK') setExchange('LSE');
                if (market === 'SE') setExchange('OMXSTO');
                if (market === 'CA') setExchange('TSX');
            }, [market]);

            // Save Watchlist
            useEffect(() => {
                localStorage.setItem('swingTraderWatchlist', JSON.stringify(watchlist));
            }, [watchlist]);

            // Functie: Nieuws Ophalen via RSS Proxy
            const fetchNewsForWatchlist = async () => {
                if (watchlist.length === 0) return;
                setIsFetchingNews(true);
                
                const newNewsData = { ...newsData };
                
                for (const item of watchlist) {
                    try {
                        let yTicker = item.ticker.toUpperCase();
                        if (item.market === 'EU') yTicker += '.AS'; 
                        if (item.market === 'UK') yTicker += '.L';  
                        if (item.market === 'SE') yTicker += '.ST'; 
                        if (item.market === 'CA') yTicker += '.TO'; // TSX beurs voor Yahoo Finance
                        
                        const rssUrl = `https://finance.yahoo.com/rss/headline?s=${yTicker}`;
                        const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(rssUrl)}`;
                        
                        const res = await fetch(proxyUrl);
                        const data = await res.json();
                        
                        const parser = new DOMParser();
                        const xmlDoc = parser.parseFromString(data.contents, "text/xml");
                        const items = xmlDoc.querySelectorAll("item");
                        
                        if (items.length > 0) {
                            newNewsData[item.ticker] = {
                                title: items[0].querySelector("title")?.textContent || "Geen titel",
                                link: items[0].querySelector("link")?.textContent || "#",
                            };
                        } else {
                            newNewsData[item.ticker] = null; 
                        }
                    } catch (error) {
                        newNewsData[item.ticker] = null;
                    }
                }
                
                setNewsData(newNewsData);
                setIsFetchingNews(false);
            };

            // Haal nieuws op bij eerste keer laden
            useEffect(() => {
                fetchNewsForWatchlist();
            }, []);

            const toggleWatchlist = () => {
                const alreadySaved = watchlist.find(item => item.ticker === ticker);
                if (alreadySaved) {
                    setWatchlist(watchlist.filter(item => item.ticker !== ticker));
                } else {
                    setWatchlist([...watchlist, { ticker, market, exchange }]);
                }
            };
            
            const isSaved = watchlist.some(item => item.ticker === ticker);

            const loadFromWatchlist = (item) => {
                setTicker(item.ticker);
                setMarket(item.market);
                setExchange(item.exchange);
            };

            const removeFromWatchlist = (e, itemTicker) => {
                e.stopPropagation(); 
                setWatchlist(watchlist.filter(item => item.ticker !== itemTicker));
            };

            // TradingView Widget
            useEffect(() => {
                const initWidget = () => {
                    if (window.TradingView) {
                        const container = document.getElementById('tradingview_widget');
                        if(container) container.innerHTML = ''; 
                        
                        let symbolCode = `${exchange}:${ticker.toUpperCase()}`;

                        new window.TradingView.widget({
                            "width": "100%",
                            "height": "100%",
                            "symbol": symbolCode,
                            "interval": "D",
                            "timezone": "Europe/Brussels",
                            "theme": "dark",
                            "style": "1",
                            "locale": "nl_NL",
                            "toolbar_bg": "#f1f3f6",
                            "enable_publishing": false,
                            "allow_symbol_change": true,
                            "container_id": "tradingview_widget",
                            "hide_side_toolbar": false,
                            "studies": [ "RSI@tv-basicstudies", "MASimple@tv-basicstudies" ] 
                        });
                    }
                };

                if (!document.getElementById('tv-widget-script')) {
                    const script = document.createElement('script');
                    script.id = 'tv-widget-script';
                    script.src = 'https://s3.tradingview.com/tv.js';
                    script.async = true;
                    script.onload = initWidget;
                    document.body.appendChild(script);
                } else {
                    setTimeout(initWidget, 500); 
                }
            }, [ticker, market, exchange]);

            // Signaal Logica
            const analyzeSignal = () => {
                let score = 0;
                let messages = [];
                let color = "gray";

                const rsi = parseInt(manualRSI);
                if (rsi < 35) { score += 2; messages.push("✅ RSI is laag/goedkoop (<35)."); } 
                else if (rsi > 70) { score -= 2; messages.push("❌ RSI is te hoog/duur (>70)."); } 
                else { messages.push("ℹ️ RSI is neutraal."); }

                if (trend === 'bullish') { score += 1; messages.push("✅ Trend is positief."); } 
                else if (trend === 'bearish') { score -= 1; messages.push("⚠️ Trend is negatief."); }

                if (macdCross === 'bullish') { score += 2; messages.push("🚀 MACD Kruising Omhoog: Koop!"); } 
                else if (macdCross === 'bearish') { score -= 3; messages.push("🛑 MACD Kruising Omlaag: Verkoop!"); }

                messages.push("📅 Check zeker ook de datum van de cijfers!");

                let verdict = "AFWACHTEN";
                if (score >= 4) { verdict = "STERK KOOP SIGNAAL"; color = "green"; } 
                else if (score >= 2) { verdict = "MOGELIJKE KANS"; color = "yellow"; } 
                else { verdict = "NIET KOPEN"; color = "red"; }

                setAdvice({ verdict, messages, color });
            };

            const calculateTrade = () => {
                const price = parseFloat(manualPrice);
                if (!price) return null;
                const stopLossPrice = price * 0.98; 
                const riskPerShare = price - stopLossPrice;
                const maxRiskEuro = 50; 
                const shares = Math.floor(maxRiskEuro / riskPerShare);
                const totalInvested = shares * price;
                const takeProfit = price + (riskPerShare * 3); 
                return { shares, totalInvested, stopLossPrice, takeProfit, maxRiskEuro };
            };

            const tradeData = calculateTrade();

            return (
                <div className="min-h-screen bg-slate-900 text-slate-100 p-4 font-sans pb-20">
                    <div className="max-w-6xl mx-auto space-y-6">
                        
                        {/* HEADER & INPUTS */}
                        <div className="bg-slate-800 p-4 rounded-xl shadow-lg border border-slate-700">
                            <div className="flex flex-col md:flex-row gap-4 justify-between items-start md:items-center mb-4 border-b border-slate-700 pb-4">
                                <h1 className="text-xl font-bold text-blue-400 flex items-center gap-2">
                                    <IconTrendingUp /> SwingTrader V19
                                </h1>
                                
                                {/* MARKTEN */}
                                <div className="flex flex-wrap gap-2 w-full md:w-auto items-center">
                                    <div className="flex flex-wrap bg-slate-900 rounded-lg p-1 border border-slate-600">
                                        <button onClick={() => setMarket('EU')} className={`px-3 py-1.5 text-xs font-bold rounded-md transition-colors ${market === 'EU' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-white'}`}>🇪🇺 EU</button>
                                        <button onClick={() => setMarket('US')} className={`px-3 py-1.5 text-xs font-bold rounded-md transition-colors ${market === 'US' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-white'}`}>🇺🇸 US</button>
                                        <button onClick={() => setMarket('UK')} className={`px-3 py-1.5 text-xs font-bold rounded-md transition-colors ${market === 'UK' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-white'}`}>🇬🇧 UK</button>
                                        <button onClick={() => setMarket('SE')} className={`px-3 py-1.5 text-xs font-bold rounded-md transition-colors ${market === 'SE' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-white'}`}>🇸🇪 SE</button>
                                        <button onClick={() => setMarket('CA')} className={`px-3 py-1.5 text-xs font-bold rounded-md transition-colors ${market === 'CA' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-white'}`}>🇨🇦 CA</button>
                                    </div>

                                    <select 
                                        value={exchange}
                                        onChange={(e) => setExchange(e.target.value)}
                                        className="bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-white text-xs font-mono outline-none hover:border-blue-500"
                                    >
                                        {market === 'EU' && <><option value="EURONEXT">Euronext (AMS/BRU)</option><option value="TRADEGATE">Tradegate (DE)</option><option value="XETR">Xetra (DE)</option></>}
                                        {market === 'US' && <><option value="NASDAQ">NASDAQ</option><option value="NYSE">NYSE</option></>}
                                        {market === 'UK' && <><option value="LSE">Londen (LSE)</option></>}
                                        {market === 'SE' && <><option value="OMXSTO">Stockholm (OMX)</option></>}
                                        {market === 'CA' && <><option value="TSX">Toronto (TSX)</option><option value="NEO">NEO Exchange</option></>}
                                    </select>
                                </div>
                            </div>

                            <div className="flex flex-col md:flex-row gap-4 items-end">
                                {/* TICKER INPUT */}
                                <div className="relative flex-grow w-full">
                                    <label className="text-[10px] text-slate-400 uppercase tracking-wide font-bold mb-1 block">Ticker / Symbool</label>
                                    <div className="flex items-center gap-2">
                                        <div className="flex-grow flex items-center bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 focus-within:border-blue-500">
                                            <IconSearch className="text-slate-400" />
                                            <input 
                                                type="text" 
                                                value={ticker}
                                                onChange={(e) => setTicker(e.target.value.toUpperCase())}
                                                className="bg-transparent border-none outline-none text-white ml-2 w-full font-mono placeholder-slate-600 uppercase"
                                                placeholder="Typ ticker (bv. BESI)..."
                                            />
                                        </div>
                                        
                                        <button onClick={toggleWatchlist} className={`p-2 rounded-lg border transition-colors flex-shrink-0 ${isSaved ? 'bg-yellow-900/30 border-yellow-500 text-yellow-400' : 'bg-slate-700 border-slate-600 text-slate-400 hover:text-white'}`} title="Zet op Watchlist">
                                            <IconStar fill={isSaved ? "currentColor" : "none"} />
                                        </button>

                                        <a href={`https://www.google.com/search?q=${ticker}+stock+ticker`} target="_blank" rel="noopener noreferrer" className="bg-slate-700 hover:bg-slate-600 text-white px-3 py-2 rounded-lg text-xs font-bold whitespace-nowrap border border-slate-500 flex-shrink-0">
                                            🔍 Zoek Ticker
                                        </a>
                                    </div>
                                </div>
                            </div>
                            
                            <div className="mt-2 flex justify-start gap-4 pb-2 border-b border-slate-700">
                                <a href={`https://www.google.com/search?q=${ticker}+stock+earnings+date`} target="_blank" rel="noopener noreferrer" className="text-[10px] text-blue-400 hover:text-blue-300 cursor-pointer flex items-center gap-1">
                                    📅 Check datum cijfers
                                </a>
                                <a href={`https://www.google.com/search?q=${ticker}+investor+relations+press+releases`} target="_blank" rel="noopener noreferrer" className="text-[10px] text-green-400 hover:text-green-300 cursor-pointer flex items-center gap-1">
                                    🏢 Bedrijfswebsite
                                </a>
                            </div>

                            {/* WATCHLIST & NIEUWS RADAR */}
                            {watchlist.length > 0 && (
                                <div className="mt-4 flex flex-col md:flex-row gap-6">
                                    {/* Linkerkant: De Watchlist Knoppen */}
                                    <div className="md:w-1/3">
                                        <div className="flex justify-between items-end mb-2">
                                            <label className="text-[10px] text-slate-400 uppercase tracking-wide font-bold">Mijn Watchlist</label>
                                        </div>
                                        <div className="flex flex-wrap gap-2">
                                            {watchlist.map((item, idx) => (
                                                <div key={idx} onClick={() => loadFromWatchlist(item)} className={`flex items-center gap-2 px-3 py-1.5 rounded-full border cursor-pointer transition-colors whitespace-nowrap ${ticker === item.ticker ? 'bg-blue-900 border-blue-500 text-white' : 'bg-slate-700 border-slate-600 text-slate-300 hover:bg-slate-600'}`}>
                                                    <span className="font-mono text-sm">{item.ticker}</span>
                                                    <button onClick={(e) => removeFromWatchlist(e, item.ticker)} className="ml-1 hover:text-red-400"><IconTrash /></button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    {/* Rechterkant: Officiële Bronnen Scanner */}
                                    <div className="md:w-2/3 bg-slate-900/50 p-3 rounded-lg border border-slate-700">
                                        <div className="flex justify-between items-center mb-3 border-b border-slate-700 pb-2">
                                            <label className="text-[10px] text-blue-400 uppercase tracking-wide font-bold flex items-center gap-1">
                                                <IconNews className="w-3 h-3"/> Watchlist Nieuws & Bronnen
                                            </label>
                                            <button onClick={fetchNewsForWatchlist} className="text-[10px] text-slate-400 hover:text-white" title="Check financiële pers">
                                                {isFetchingNews ? "Zoeken..." : "↻ Scan Headlines"}
                                            </button>
                                        </div>
                                        
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 max-h-40 overflow-y-auto pr-2">
                                            {watchlist.map((item, idx) => {
                                                const news = newsData[item.ticker];
                                                return (
                                                    <div key={idx} className="text-xs bg-slate-800 p-2 rounded border border-slate-700">
                                                        <div className="font-bold text-slate-200 mb-1 flex justify-between">
                                                            {item.ticker}
                                                            <span className="text-[9px] text-slate-500">{item.market}</span>
                                                        </div>
                                                        
                                                        {/* De Officiële Bedrijfslink */}
                                                        <a href={`https://www.google.com/search?q=${item.ticker}+investor+relations+press+releases`} target="_blank" rel="noopener noreferrer" className="text-[10px] bg-slate-700 hover:bg-slate-600 text-white px-2 py-1 rounded border border-slate-600 flex items-center gap-1 mb-2 w-max transition-colors">
                                                            🏢 Officiële Persberichten (IR)
                                                        </a>

                                                        {/* De Yahoo Headline Scanner */}
                                                        {news ? (
                                                            <a href={news.link} target="_blank" rel="noopener noreferrer" className="text-slate-400 hover:text-white hover:underline leading-tight line-clamp-2 block border-l-2 border-slate-600 pl-2">
                                                                "{news.title}"
                                                            </a>
                                                        ) : (
                                                            <span className="text-slate-600 italic text-[10px] block border-l-2 border-slate-700 pl-2">Geen financiële headlines gevonden.</span>
                                                        )}
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>

                        {/* MAIN GRID */}
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 h-[900px] lg:h-[750px]">
                            
                            {/* CHART */}
                            <div className="lg:col-span-2 bg-slate-800 rounded-xl border border-slate-700 overflow-hidden relative shadow-md flex flex-col">
                                <div className="absolute top-2 left-2 z-10 flex gap-2">
                                    <a 
                                        href={`https://www.tradingview.com/chart/?symbol=${exchange}:${ticker}`} 
                                        target="_blank" 
                                        rel="noopener noreferrer"
                                        className="bg-blue-600/80 hover:bg-blue-600 px-2 py-1 rounded text-xs flex items-center gap-1 backdrop-blur-sm transition-colors cursor-pointer"
                                    >
                                        <IconExternal /> Open Groot
                                    </a>
                                </div>
                                <div id="tradingview_widget" className="w-full flex-grow"></div>
                            </div>

                            {/* ANALYSIS TOOLS */}
                            <div className="bg-slate-800 p-5 rounded-xl border border-slate-600 shadow-xl overflow-y-auto flex flex-col gap-6">
                                
                                {/* Checklist */}
                                <div>
                                    <h3 className="text-sm font-bold text-slate-400 uppercase tracking-wide mb-3 border-b border-slate-700 pb-2">1. Checklist</h3>
                                    
                                    <div className="space-y-4">
                                        <div>
                                            <label className="text-xs text-slate-400 block mb-1">RSI Waarde</label>
                                            <input type="number" placeholder="0-100" value={manualRSI} onChange={(e) => setManualRSI(e.target.value)} className="w-full bg-slate-900 border border-slate-600 rounded p-2 text-white"/>
                                        </div>

                                        <div>
                                            <label className="text-xs text-slate-400 block mb-1">Trend (vs MA50)</label>
                                            <div className="grid grid-cols-3 gap-2">
                                                <button onClick={() => setTrend('bullish')} className={`p-2 text-xs rounded border ${trend === 'bullish' ? 'bg-green-900 border-green-500 text-white' : 'border-slate-600 text-slate-400'}`}>↗ Op</button>
                                                <button onClick={() => setTrend('neutral')} className={`p-2 text-xs rounded border ${trend === 'neutral' ? 'bg-yellow-900 border-yellow-500 text-white' : 'border-slate-600 text-slate-400'}`}>→ Vlak</button>
                                                <button onClick={() => setTrend('bearish')} className={`p-2 text-xs rounded border ${trend === 'bearish' ? 'bg-red-900 border-red-500 text-white' : 'border-slate-600 text-slate-400'}`}>↘ Neer</button>
                                            </div>
                                        </div>

                                        <div className="border-t border-slate-700 pt-3">
                                            <label className="text-xs text-blue-400 block mb-1 font-bold">MACD Signaal</label>
                                            <div className="grid grid-cols-3 gap-2">
                                                <button onClick={() => setMacdCross('bullish')} className={`p-2 text-xs rounded border ${macdCross === 'bullish' ? 'bg-green-600 border-green-400 text-white' : 'border-slate-600 text-slate-400'}`}>↗ Kruist Op</button>
                                                <button onClick={() => setMacdCross('none')} className={`p-2 text-xs rounded border ${macdCross === 'none' ? 'bg-slate-700 border-slate-500 text-white' : 'border-slate-600 text-slate-400'}`}>- Geen</button>
                                                <button onClick={() => setMacdCross('bearish')} className={`p-2 text-xs rounded border ${macdCross === 'bearish' ? 'bg-red-900 border-red-500 text-white' : 'border-slate-600 text-slate-400'}`}>↘ Kruist Neer</button>
                                            </div>
                                        </div>

                                        <button onClick={analyzeSignal} className="w-full bg-blue-600 hover:bg-blue-500 py-3 rounded font-bold text-sm transition-colors shadow-lg mt-2">Check Signaal</button>

                                        {advice && (
                                            <div className={`p-3 rounded border-l-4 mt-2 ${advice.color === 'green' ? 'bg-green-900/30 border-green-500' : advice.color === 'red' ? 'bg-red-900/30 border-red-500' : 'bg-yellow-900/30 border-yellow-500'}`}>
                                                <p className="font-bold text-sm mb-1">{advice.verdict}</p>
                                                <ul className="text-xs space-y-1 opacity-80">
                                                    {advice.messages.map((m, i) => <li key={i}>{m}</li>)}
                                                </ul>
                                            </div>
                                        )}
                                    </div>
                                </div>

                                {/* Calculator */}
                                <div>
                                    <h3 className="text-sm font-bold text-slate-400 uppercase tracking-wide mb-3 border-b border-slate-700 pb-2 flex items-center gap-2">
                                        <IconCalc /> 2. Calculator
                                    </h3>
                                    <div className="space-y-4">
                                        <div>
                                            <label className="text-xs text-slate-400 block mb-1">Huidige Prijs (€/$)</label>
                                            <input 
                                                type="number" 
                                                value={manualPrice} 
                                                onChange={(e) => setManualPrice(e.target.value)} 
                                                className="w-full bg-slate-900 border border-slate-600 rounded p-2 text-white font-mono text-lg font-bold"
                                                placeholder="0.00"
                                            />
                                        </div>

                                        {tradeData ? (
                                            <div className="bg-slate-700 p-4 rounded-lg text-sm space-y-2 border-l-4 border-blue-500 shadow-md">
                                                <div className="flex justify-between font-bold text-white text-lg border-b border-slate-600 pb-2">
                                                    <span>Koop:</span><span>{tradeData.shares} aandelen</span>
                                                </div>
                                                <div className="flex justify-between text-slate-300"><span>Investering:</span><span>€ {tradeData.totalInvested.toFixed(2)}</span></div>
                                                <div className="flex justify-between text-red-400"><span>Stop Loss:</span><span>€ {tradeData.stopLossPrice.toFixed(2)}</span></div>
                                                <div className="flex justify-between text-green-400"><span>Take Profit:</span><span>€ {tradeData.takeProfit.toFixed(2)}</span></div>
                                                <div className="text-[10px] text-slate-400 text-center pt-1 italic">Max risico €50 (1%)</div>
                                            </div>
                                        ) : <p className="text-xs text-slate-500 text-center italic">Vul de koers hierboven in.</p>}
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* SPIEKBRIEFJE */}
                        <div className="bg-slate-800 rounded-xl border border-slate-700 p-6 mt-8">
                            <h2 className="text-xl font-bold text-blue-400 mb-4 flex items-center gap-2">
                                <IconBook /> Trading Spiekbriefje
                            </h2>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                
                                <div className="space-y-6">
                                    <div className="bg-slate-700/50 p-4 rounded-lg border border-slate-600">
                                        <h3 className="font-bold text-lg mb-2 text-white">1. De Trend (Is het veilig?)</h3>
                                        <ul className="text-sm space-y-2">
                                            <li className="flex gap-2 text-slate-300">
                                                <span className="text-blue-400 font-bold w-20">Kijk naar:</span>
                                                <span>De blauwe lijn (Moving Average 50).</span>
                                            </li>
                                            <li className="bg-green-900/30 p-2 rounded border-l-2 border-green-500">
                                                <span className="font-bold text-green-400">Positief:</span> Koers ligt <span className="underline">boven</span> de blauwe lijn.
                                            </li>
                                            <li className="bg-red-900/30 p-2 rounded border-l-2 border-red-500">
                                                <span className="font-bold text-red-400">Negatief:</span> Koers ligt <span className="underline">onder</span> de blauwe lijn.
                                            </li>
                                        </ul>
                                    </div>

                                    <div className="bg-slate-700/50 p-4 rounded-lg border border-slate-600">
                                        <h3 className="font-bold text-lg mb-2 text-white">2. RSI (Is het goedkoop?)</h3>
                                        <ul className="text-sm space-y-2">
                                            <li className="flex gap-2 text-slate-300">
                                                <span className="text-blue-400 font-bold w-20">Doel:</span>
                                                <span>Koop laag, verkoop hoog.</span>
                                            </li>
                                            <li className="bg-green-900/30 p-2 rounded border-l-2 border-green-500">
                                                <span className="font-bold text-green-400">&lt; 30 (Oversold):</span> Iedereen heeft verkocht. Kans op bounce. <span className="font-bold">KOOPZONE</span>.
                                            </li>
                                            <li className="bg-red-900/30 p-2 rounded border-l-2 border-red-500">
                                                <span className="font-bold text-red-400">&gt; 70 (Overbought):</span> Te hard gestegen. Gevaar. <span className="font-bold">VERKOOPZONE</span>.
                                            </li>
                                        </ul>
                                    </div>
                                </div>

                                <div className="space-y-6">
                                    <div className="bg-slate-700/50 p-4 rounded-lg border border-slate-600">
                                        <h3 className="font-bold text-lg mb-2 text-white">3. Steun & Weerstand</h3>
                                        <ul className="text-sm space-y-2">
                                            <li className="bg-blue-900/30 p-2 rounded border-l-2 border-blue-500">
                                                <span className="font-bold text-blue-300">Steun (De Vloer):</span>
                                                <br/>Lijn onder de punten waar koers stopte met dalen.
                                                <br/>👉 <span className="italic">Koop zo dicht mogelijk bij de vloer.</span>
                                            </li>
                                            <li className="bg-yellow-900/30 p-2 rounded border-l-2 border-yellow-500">
                                                <span className="font-bold text-yellow-300">Weerstand (Het Plafond):</span>
                                                <br/>Lijn boven de toppen. Verkoop hier.
                                            </li>
                                        </ul>
                                    </div>

                                    <div className="bg-slate-700/50 p-4 rounded-lg border border-slate-600">
                                        <h3 className="font-bold text-lg mb-2 text-blue-300">4. MACD (Startschot) 🚀</h3>
                                        <ul className="text-sm space-y-2">
                                            <li className="text-slate-400 mb-1">
                                                "Geven we gas of remmen we?"
                                            </li>
                                            <li className="bg-green-900/30 p-2 rounded border-l-2 border-green-500">
                                                <span className="font-bold text-green-400">KOOP (Bullish Cross):</span>
                                                <br/>Blauwe lijn kruist oranje naar <span className="underline font-bold">BOVEN</span>.
                                                <br/><em>Momentum is gedraaid: Groen licht!</em>
                                            </li>
                                            <li className="bg-red-900/30 p-2 rounded border-l-2 border-red-500">
                                                <span className="font-bold text-red-400">VERKOOP (Bearish Cross):</span>
                                                <br/>Blauwe lijn kruist oranje naar <span className="underline font-bold">BENEDEN</span>.
                                            </li>
                                        </ul>
                                    </div>
                                </div>

                                <div className="bg-slate-800 p-1 md:col-span-2 mt-4">
                                    <h3 className="font-bold text-xl mb-4 text-white flex items-center gap-2 border-b border-slate-700 pb-2">
                                        <IconZoom className="text-blue-400" /> 5. Hoe ver kijk je terug? (De Zoom-Strategie)
                                    </h3>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        <div className="bg-slate-700/30 p-4 rounded border-l-4 border-blue-500">
                                            <h4 className="font-bold text-blue-300 mb-2">Stap 1: Uitzoomen naar 1 Jaar</h4>
                                            <p className="text-sm text-slate-300 italic mb-2">"Het Grote Plaatje"</p>
                                            <ul className="text-sm text-slate-400 space-y-2">
                                                <li><span className="font-bold text-white">Waarom?</span> Je zoekt naar de echte Steun en Weerstand.</li>
                                                <li><span className="font-bold text-white">Je wilt zien:</span> Waar is de koers 8 maanden geleden gestopt met dalen?</li>
                                                <li className="bg-slate-800/80 p-2 rounded text-xs mt-2">⚠️ Als je maar 1 maand terugkijkt, zie je misschien niet dat het aandeel vlak boven een "afgrond" staat.</li>
                                            </ul>
                                        </div>
                                        <div className="bg-slate-700/30 p-4 rounded border-l-4 border-purple-500">
                                            <h4 className="font-bold text-purple-300 mb-2">Stap 2: Inzoomen naar 3 Maanden</h4>
                                            <p className="text-sm text-slate-300 italic mb-2">"De Actie"</p>
                                            <ul className="text-sm text-slate-400 space-y-2">
                                                <li><span className="font-bold text-white">Waarom?</span> Hierop baseer je de beslissing met de RSI en MACD.</li>
                                                <li><span className="font-bold text-white">Je wilt zien:</span> Of de trend <em>recent</em> aan het draaien is.</li>
                                                <li className="bg-slate-800/80 p-2 rounded text-xs mt-2">⚡ De snelle indicatoren reageren op deze kortere termijn. Zoom in als de grote lijnen goed staan.</li>
                                            </ul>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<SwingTraderPro />);
    </script>
</body>
</html>
